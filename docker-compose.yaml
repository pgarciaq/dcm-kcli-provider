services:
  kweb:
    image: quay.io/karmab/kcli:latest
    entrypoint: ["/usr/bin/kweb"]
    ports:
      - "8000:8000"
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ~/.kcli:/root/.kcli:ro
      - /var/lib/libvirt/images:/var/lib/libvirt/images
      - /var/run/libvirt:/var/run/libvirt

  dcm-kcli-provider:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      KWEB_URL: http://kweb:8000
      SPM_URL: http://spm:8080
      LISTEN_ADDRESS: ":8080"
      STATE_STORE_PATH: /data/state.db
      LOG_LEVEL: info
    volumes:
      - provider-data:/data
    depends_on:
      - kweb

volumes:
  provider-data:
